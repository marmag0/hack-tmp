services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in .env}
      APP_USER: ${APP_USER:?Set APP_USER in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}"
    command: ["postgres", "-p", "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dbmate:
    image: amacneil/dbmate:2.34.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable"
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_STRICT: "true"
    volumes:
      - ./db:/db
    command: ["--wait", "up"]
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+asyncpg://${APP_USER:?Set APP_USER in .env}:${APP_PASSWORD:?Set APP_PASSWORD in .env}@db:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      BACKEND_PORT: ${BACKEND_PORT:?Set BACKEND_PORT in .env}
    ports:
      - "${BACKEND_PORT:?Set BACKEND_PORT in .env}:${BACKEND_PORT:?Set BACKEND_PORT in .env}"
    command:
      [
        "fastapi",
        "dev",
        "--host",
        "0.0.0.0",
        "--port",
        "${BACKEND_PORT:?Set BACKEND_PORT in .env}",
      ]
    volumes:
      - ./backend:/app

  # other services can go here

volumes:
  postgres_data:
